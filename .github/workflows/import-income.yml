name: Import official age and employment income distribution
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import_income_distribution.py
      - .github/workflows/import-income.yml
  schedule:
    - cron: '0 2 15 2 *'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract official income distribution and verify totals
        run: python scripts/import_income_distribution.py
      - name: Commit verified source data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/income-distribution-2022.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update source-verified income distribution by age and job type"
          git push
