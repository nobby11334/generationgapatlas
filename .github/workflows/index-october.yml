name: Index official October 2026 support review materials
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/index_october_docs.py'
      - '.github/workflows/index-october.yml'
  schedule:
    - cron: '10 2 3 * *'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pdfplumber==0.11.7'
      - run: python scripts/index_october_docs.py
      - name: Publish index only when all files were verified
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/october-2026-official-documents.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Index verified official October 2026 policy review documents"
          git push
