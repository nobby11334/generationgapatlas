name: Discover historical official income tables
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/discover_historical_tables.py
      - .github/workflows/discover-income.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/discover_historical_tables.py
