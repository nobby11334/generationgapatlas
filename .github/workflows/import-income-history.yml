name: Import verified historical income distributions
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import_income_history.py
      - .github/workflows/import-income-history.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install xlrd==2.0.2
      - name: Harmonize public 2002 2012 and 2022 distributions
        run: python scripts/import_income_history.py
      - name: Publish after all cross-year totals pass validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/income-distribution-history.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh comparable 2002-2012-2022 income distributions"
          git push
