name: Extract original October 2026 KPI pages
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/extract_latest_kpi_pages.py
      - .github/workflows/extract-kpi.yml
  schedule:
    - cron: '20 2 3 * *'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pdfplumber==0.11.7'
      - run: python scripts/extract_latest_kpi_pages.py
      - name: Commit verified pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/official-kpi-pages-2026-10.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish source-linked original October KPI page texts"
          git push
