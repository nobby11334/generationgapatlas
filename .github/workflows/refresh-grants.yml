name: Refresh verified local grant projects
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_local_grants.py'
      - 'scripts/import_wide_area_partners.py'
      - '.github/workflows/refresh-grants.yml'
  schedule:
    - cron: '30 1 1 * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pdfplumber==0.11.7'
      - name: Extract and validate all 152 published projects
        run: python scripts/import_local_grants.py
      - name: Extract and validate the 207 partner municipalities
        run: python scripts/import_wide_area_partners.py
      - name: Commit only fully validated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/local-grants-2026.json data/wide-area-partners-2026.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update fully verified local grant project registry"
          git push
