name: Probe historical income XLSX layout
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/inspect_income_2012.py
      - .github/workflows/probe-2012.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_income_2012.py
